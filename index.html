<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const useDarkTheme = savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", useDarkTheme);
        const savedLanguage = localStorage.getItem("language");
        if (savedLanguage === "fr" || savedLanguage === "en") document.documentElement.lang = savedLanguage;
      } catch {
        // Preferences are initialized by the React app if storage is unavailable.
      }
    </script>

    <title>NoxCoreDev — Othman</title>

    <meta
      name="description"
      content="NoxCoreDev (Othman) — développeur autodidacte en automatisation, DevOps, Web, App & AI. Bots WhatsApp/Telegram, pipelines de déploiement, applications web."
    />

    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="theme-color" content="#4F5DF5" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NoxCoreDev — Othman" />
    <meta
      property="og:description"
      content="Développeur autodidacte en automatisation, DevOps, Web, App & AI Developer."
    />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:site_name" content="NoxCoreDev" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NoxCoreDev — Othman" />
    <meta
      name="twitter:description"
      content="Développeur autodidacte en automatisation, DevOps, Web, App & AI Developer."
    />
  </head>

  <body class="bg-white dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
