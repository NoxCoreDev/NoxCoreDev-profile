    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const useDarkTheme = savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", useDarkTheme);
        const savedLanguage = localStorage.getItem("language");
        if (savedLanguage === "fr" || savedLanguage === "en") document.documentElement.lang = savedLanguage;
      } catch {
        // Preferences are initialized by the React app if storage is unavailable.
      }
    </script>
